<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大甲手搖抽抽樂 V5.0 🥤</title>
    <style>
        /* --- 1. 全域與背景設定 (已修正無法捲動的問題) --- */
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            
            /* --- 風格配色：改回您喜歡的粉紅色系漸層 --- */
            background: linear-gradient(180deg, #ff758c 0%, #ff7eb3 100%);
            
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            
            /* ⚠️ 關鍵修正：允許垂直捲動 (auto)，但隱藏水平捲軸 (hidden) */
            overflow-y: auto; 
            overflow-x: hidden; 
            
            /* 讓內容置中排列 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- 2. 背景動態裝飾容器 (使用 Fixed 定位) --- */
        /* 這樣當您往下滑看菜單時，背景的裝飾不會跟著跑掉，視覺效果更好 */
        #background-decorations {
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* 讓滑鼠事件穿透，不會擋住按鈕 */
            z-index: -1; /* 放在最底層 */
            overflow: hidden;
        }

        .deco-item {
            position: absolute;
            bottom: -100px;
            opacity: 0.6;
            animation: floatUp linear infinite;
            font-size: 35px; /* Emoji 的大小 */
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-120vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* --- 3. 主內容容器 --- */
        .main-container {
            background: rgba(255, 255, 255, 0.2); /* 半透明白色背景 */
            backdrop-filter: blur(8px); /* 毛玻璃效果 */
            padding: 30px 20px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            margin-bottom: 50px; /* 下方留空間方便滑動 */
            position: relative;
            z-index: 10;
        }

        /* --- 4. 標題與文字 --- */
        header { margin-bottom: 20px; z-index: 10; text-align: center;}
        h1 {
            font-size: 2.2rem; margin: 10px 0; color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2); font-weight: bold;
        }
        .subtitle { font-size: 1rem; color: #fff; opacity: 0.9; }

        /* --- 5. 抽籤結果區 --- */
        .result-box-container {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .result-box {
            min-height: 80px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #shop-name { 
            font-size: 2.2rem; font-weight: bold; color: #ff4757; /* 深粉紅字 */
            margin: 0; 
        }
        #shop-desc { 
            font-size: 1rem; color: #ff6b81; margin-top: 10px; font-weight: bold; display: none;
        }

        /* --- 6. 按鈕 --- */
        .draw-btn {
            background: #fff;
            color: #ff4757; /* 粉紅文字 */
            border: none;
            padding: 15px 40px;
            font-size: 1.4rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
            transition: all 0.2s;
            font-weight: 900;
            width: 100%;
        }
        .draw-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(255, 71, 87, 0.5); }
        .draw-btn:active { transform: scale(0.98); }
        .draw-btn:disabled { background: #eee; color: #aaa; cursor: not-allowed; box-shadow: none; }

        /* --- 7. 菜單顯示區 --- */
        .menu-container {
            display: none;
            margin-top: 25px;
            background: #fff;
            padding: 15px;
            border-radius: 20px;
            color: #333;
            animation: fadeIn 0.5s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .menu-img {
            width: 100%; height: auto; border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px;
            min-height: 200px; background-color: #eee; object-fit: contain;
        }
        .menu-link {
            display: block; text-decoration: none;
            color: #fff; font-weight: bold; font-size: 1rem;
            padding: 15px; background: #ff4757; border-radius: 50px;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s;
        }
        .menu-link:hover { transform: translateY(-2px); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

    <script>
        // --- 1. 初始化背景動態裝飾 (使用 Emoji) ---
        function initBackgroundDecorations() {
            const container = document.getElementById('background-decorations');
            const numItems = 20; // 裝飾品的數量
            const decoEmojis = ['🍍', '🌸', '🥤', '✨', '💖', '🍠']; // 鳳梨、櫻花、飲料、亮光、愛心、芋頭

            for (let i = 0; i < numItems; i++) {
                const decoItem = document.createElement('div');
                decoItem.classList.add('deco-item');
                decoItem.textContent = decoEmojis[Math.floor(Math.random() * decoEmojis.length)];
                
                // 隨機設定位置、大小和動畫速度
                decoItem.style.left = Math.random() * 100 + '%';
                const duration = Math.random() * 10 + 10; // 10~20秒
                decoItem.style.animationDuration = duration + 's';
                decoItem.style.animationDelay = Math.random() * 15 + 's';
                const scale = Math.random() * 0.6 + 0.8; // 0.8~1.4倍大小
                decoItem.style.fontSize = (35 * scale) + 'px';

                container.appendChild(decoItem);
            }
        }
