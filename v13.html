<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大甲手搖抽抽樂 V13.4 📱</title>
    <style>
        /* --- 1. 全域與背景設定 --- */
        * { box-sizing: border-box; } 

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            margin: 0; padding: 10px;
            min-height: 100vh;
            overflow-x: hidden; 
            display: flex; flex-direction: column; align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 2. 飄浮背景容器 --- */
        .floating-container {
            position: fixed; width: 100%; height: 100%; top: 0; left: 0;
            z-index: 0; pointer-events: none; overflow: hidden;
        }

        /* 裝飾元素 */
        .boba {
            position: absolute; background: rgba(0, 0, 0, 0.2); border-radius: 50%;
            bottom: -60px; animation: floatUp 10s infinite ease-in;
        }
        .sakura-petal {
            position: absolute;
            background: linear-gradient(120deg, #ffc0cb 0%, #ffb7b2 100%);
            border-radius: 100% 0 100% 0;
            bottom: -60px; opacity: 0.85;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            animation: floatUpSakuraPetal 12s infinite linear;
        }
        .deco-img {
            position: absolute; opacity: 0.9; 
            width: 72px; height: auto;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
            animation: floatUpIcon 15s infinite ease-in;
            bottom: -100px; 
        }

        @keyframes floatUp { 
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.6; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }
        @keyframes floatUpSakuraPetal { 
            0% { transform: translateY(0) rotate(0deg) skew(10deg); opacity: 0; }
            20% { opacity: 0.9; }
            100% { transform: translateY(-120vh) rotate(720deg) skew(0deg); opacity: 0; }
        }
        @keyframes floatUpIcon { 
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            20% { opacity: 0.95; }
            100% { transform: translateY(-120vh) rotate(-180deg) scale(1.2); opacity: 0; }
        }

        /* --- 3. 主容器 --- */
        .main-container {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            padding: 20px 15px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            max-width: 500px; 
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            margin-top: 10px; margin-bottom: 50px;
            position: relative; z-index: 10;
        }

        /* --- 4. 標題與按鈕 --- */
        header { margin-bottom: 15px; z-index: 10; text-align: center; width: 100%; }
        h1 {
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            margin: 10px 0; color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2); font-weight: 900; 
            letter-spacing: 2px; line-height: 1.2;
            white-space: nowrap; 
        }
        .subtitle { font-size: 1rem; color: #fff; opacity: 0.95; text-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .draw-btn {
            background: #fff; color: #23a6d5; border: none;
            padding: 15px 30px; 
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            border-radius: 50px;
            cursor: pointer; box-shadow: 0 10px 30px rgba(35, 166, 213, 0.3);
            transition: all 0.3s; font-weight: 900; width: 100%; text-transform: uppercase;
        }
        .draw-btn:hover { 
            transform: translateY(-5px) scale(1.02); 
            box-shadow: 0 15px 40px rgba(35, 166, 213, 0.5); 
            background: #23a6d5; color: #fff;
        }
        .draw-btn:disabled { background: #e0e0e0; color: #aaa; cursor: not-allowed; transform: none; box-shadow: none; }

        /* --- 5. 結果顯示區 --- */
        .result-box-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px; padding: 20px 10px; margin-bottom: 25px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            border: 2px solid rgba(255,255,255,0.8);
            min-height: 160px; width: 100%;
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            overflow: visible; position: relative;
        }

        #text-area {
            display: flex; flex-direction: row; 
            flex-wrap: wrap; justify-content: center; align-items: center; 
            gap: 10px; width: 100%;
        }
        
        #shop-name { 
            font-size: clamp(1.5rem, 8vw, 2.2rem); 
            font-weight: 900; color: #e73c7e; margin: 0; 
            line-height: 1.2; text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
            word-break: keep-all; 
        }
        
        #shop-desc { 
            font-size: 0.9rem; color: #e65100; font-weight: bold; display: none;
            background-color: #fff3e0; padding: 6px 12px;
            border-radius: 50px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            white-space: nowrap; margin: 0; 
        }

        /* 動畫元素 */
        .moon-blocks-wrapper { display: none; justify-content: center; gap: 20px; align-items: center; height: 100px; }
        .moon-block { width: 60px; height: 30px; background: #d32f2f; border-radius: 0 0 60px 60px; position: relative; }
        .tossing .moon-block { animation: toss 0.8s ease-in-out infinite; }
        .tossing .moon-block:nth-child(2) { animation-delay: 0.1s; }
        
        /* 👇 修改點：聖筊狀態，直徑面對面 */
        .saint-cup {
             gap: 2px; /* 讓它們靠得更近 */
        }
        .saint-cup .moon-block:first-child {
            /* 左筊：轉 -90度，平面朝右，顯示紅色凸面 */
            transform: rotate(-90deg);
            background: #d32f2f;
        }
        .saint-cup .moon-block:last-child {
            /* 右筊：改為平頂圓底的形狀，轉 -90度，平面朝左，顯示粉色平面 */
            border-radius: 60px 60px 0 0;
            transform: rotate(-90deg);
            background: #ffcdd2;
        }

        @keyframes toss { 0% { transform: translateY(0); } 50% { transform: translateY(-30px) rotate(360deg); } 100% { transform: translateY(0) rotate(720deg); } }

        .stick-wrapper { display: none; flex-direction: column; align-items: center; justify-content: flex-end; height: 120px; position: relative; }
        .stick-box { width: 60px; height: 80px; background: linear-gradient(90deg, #8d6e63, #5d4037); border-radius: 5px; z-index: 2; }
        
        /* 👇 修改點：籤身樣式調整 */
        .stick { 
            width: 15px; height: 100px; background: #ffe0b2; border: 1px solid #ffcc80; 
            position: absolute; bottom: 10px; z-index: 1; 
            display: flex; 
            justify-content: flex-start; /* 讓文字靠上對齊 */
            padding-top: 8px; /* 增加上方留白 */
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1); /* 增加一點竹籤質感 */
        }
        
        /* 👇 修改點：上上籤浮雕立體樣式 */
        .stick::after { 
            content: "上上籤"; 
            color: #c62828; /* 稍微深一點的紅色做基底 */
            font-size: 11px; 
            font-weight: 900; /* 最粗體 */
            margin-top: 0; 
            writing-mode: vertical-rl;
            letter-spacing: 2px;
            /* 浮雕立體效果：利用亮暗陰影創造深度 */
            text-shadow: 
                1px 1px 1px rgba(255, 255, 255, 0.6), /* 右下亮面 */
                -1px -1px 1px rgba(0, 0, 0, 0.3);    /* 左上暗面 */
        }
        
        .drawing-stick .stick { animation: rise 1s ease-out forwards; }
        @keyframes rise { 0% { transform: translateY(0); } 50% { transform: translateY(10px); } 100% { transform: translateY(-60px); } }

        .status-text { font-size: 1.4rem; color: #888; font-weight: bold; margin-top: 10px; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }

        /* --- 6. 菜單區與燈箱 --- */
        .menu-container {
            display: none; margin-top: 25px; background: #fff;
            padding: 15px; border-radius: 20px; color: #333;
            animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        .menu-img {
            width: 100%; height: auto; border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 5px;
            min-height: 150px; background-color: #f5f5f5; object-fit: contain;
            cursor: zoom-in; border: 2px solid transparent; transition: border 0.2s;
        }
        .menu-img:hover { border: 2px solid #23a6d5; }
        .click-hint { font-size: 0.85rem; color: #888; margin-bottom: 10px; display: block; }
        
        .action-buttons {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;
        }
        .menu-link, .share-btn {
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: #fff; font-weight: bold; 
            font-size: clamp(0.8rem, 4vw, 1rem); 
            padding: 10px 5px; border-radius: 50px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s; cursor: pointer; border: none;
            white-space: nowrap; 
        }
        .menu-link { background: linear-gradient(90deg, #e73c7e, #ee7752); }
        .share-btn.line { background: #06c755; }
        .share-btn.copy { background: #546e7a; }
        .share-btn.call { background: #333; }
        .menu-link:hover, .share-btn:hover { transform: translateY(-3px); opacity: 0.9; }
        .menu-link.full-width { grid-column: span 2; }

        /* --- 7. 點餐小本本區塊 --- */
        .order-pad {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 15px;
            color: #333;
            text-align: left;
            border: 2px dashed #ddd;
        }
        .order-title {
            font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; 
            color: #555; display: flex; align-items: center; gap: 5px;
        }
        .order-input-group {
            display: flex; gap: 5px; margin-bottom: 10px;
        }
        .order-input {
            padding: 8px; border: 1px solid #ccc; border-radius: 8px;
            width: 100%; font-size: 0.9rem; outline: none;
        }
        .order-input:focus { border-color: #23a6d5; }
        .add-btn {
            background: #23a6d5; color: #fff; border: none; padding: 0 15px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        #order-list {
            list-style: none; padding: 0; margin: 0;
            max-height: 200px; overflow-y: auto;
        }
        .order-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.95rem;
        }
        .delete-btn {
            color: #ff5252; cursor: pointer; font-weight: bold; margin-left: 10px; font-size: 1.2rem;
        }
        .copy-all-btn {
            width: 100%; margin-top: 15px; background: #e73c7e;
            color: #fff; border: none; padding: 12px; border-radius: 50px;
            font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(231, 60, 126, 0.3);
        }

        /* --- 8. 燈箱 --- */
        .modal {
            display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; 
            overflow: hidden; 
            background-color: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
            flex-direction: column; align-items: center; justify-content: center;
            touch-action: none; 
        }
        .modal-content {
            display: block; max-width: 100%; max-height: 100%;
            object-fit: contain; border-radius: 5px; 
            transition: transform 0.1s ease-out; transform-origin: center center;
        }
        .close {
            position: absolute; top: 20px; right: 20px; color: #fff; 
            font-size: 30px; font-weight: bold; cursor: pointer; z-index: 10000;
            background: rgba(0,0,0,0.5); padding: 5px 12px; border-radius: 50%;
        }
        .zoom-hint {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.7); font-size: 0.9rem; pointer-events: none;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes zoom { from {transform:scale(0)} to {transform:scale(1)} }

        @media (max-width: 480px) {
            h1 { letter-spacing: 1px; width: 100%; overflow: visible; }
            .subtitle { font-size: 0.9rem; }
            .result-box-container { padding: 20px 5px; }
            #shop-name { font-size: 1.6rem; }
            .draw-btn { font-size: 1.2rem; padding: 12px 20px; }
            .menu-link, .share-btn { font-size: 0.85rem; padding: 10px 2px; }
        }

    </style>
</head>
<body>

    <div class="floating-container" id="floating-bg"></div>

    <header>
        <h1>🍠 大甲手搖抽抽樂 🥤</h1>
        <div class="subtitle">媽祖保庇 • 隨機選好茶</div>
    </header>

    <div class="main-container">
        <div class="result-box-container">
            <div id="text-area" class="result-box">
                <h2 id="shop-name">天選好茶</h2>
                <p id="shop-desc">🎉 聖筊！就決定喝這家！</p>
            </div>
            <div id="moon-blocks-area" class="moon-blocks-wrapper saint-cup">
                <div class="moon-block"></div><div class="moon-block"></div>
            </div>
            <div id="stick-area" class="stick-wrapper">
                <div class="stick"></div><div class="stick-box"></div>
            </div>
            <div id="status-text" class="status-text" style="display: none;"></div>
        </div>
        
        <button id="draw-btn" class="draw-btn" onclick="startRitual()">開始求籤 ✨</button>
        
        <div id="menu-area" class="menu-container">
            <div style="text-align: left; font-size: 0.9rem; color: #666; margin-bottom: 10px; font-weight: bold;">👇 菜單請參考：</div>
            <img id="menu-img" class="menu-img" src="" alt="菜單讀取中" onclick="openModal()">
            <span class="click-hint">👆 點擊圖片可放大查看</span>
            
            <div class="action-buttons">
                <a id="map-link" href="#" target="_blank" class="menu-link full-width">📍 Google Maps 導航</a>
                <a id="phone-link" href="#" class="share-btn call">📞 訂購</a>
                <button class="share-btn line" onclick="shareToLine()">💬 揪團</button>
            </div>

            <div class="order-pad">
                <div class="order-title">📝 現場點餐統計</div>
                <div class="order-input-group">
                    <input type="text" id="input-name" class="order-input" placeholder="姓名" style="width: 25%;">
                    <input type="text" id="input-item" class="order-input" placeholder="品項" style="width: 40%;">
                    <input type="text" id="input-config" class="order-input" placeholder="糖冰" style="width: 25%;">
                    <button class="add-btn" onclick="addOrder()">+</button>
                </div>
                <ul id="order-list"></ul>
                <button class="copy-all-btn" onclick="copyAllOrders()">📋 複製完整訂購單</button>
            </div>
        </div>
    </div>

    <div id="image-modal" class="modal">
        <span class="close" onclick="closeModal()">×</span>
        <img class="modal-content" id="img-in-modal">
        <div class="zoom-hint">👐 雙指縮放 / 單指拖曳</div>
    </div>

    <script>
        // --- 1. 背景裝飾 ---
        function initBackgroundDecorations() {
            const container = document.getElementById('floating-bg');
            const numItems = 50; 
            
            const imageAssets = [
                { src: './images/deco-taro.png', alt: '🍠' },          
                { src: './images/deco-bubbletea.png', alt: '🧋' },
                { src: './images/deco-pineapple.png', alt: '🍍' },
                { src: './images/deco-sakura.png', alt: '🌸' }
            ];

            for (let i = 0; i < numItems; i++) {
                const rand = Math.random();
                let decoItem;

                if (rand < 0.2) { 
                    decoItem = document.createElement('div');
                    decoItem.className = 'boba';
                    const size = Math.random() * 31.5 + 22.5 + 'px'; 
                    decoItem.style.width = size; decoItem.style.height = size;
                } else if (rand < 0.4) {
                    decoItem = document.createElement('div');
                    decoItem.className = 'sakura-petal';
                    const w = Math.random() * 18 + 22.5 + 'px'; 
                    const h = Math.random() * 18 + 31.5 + 'px'; 
                    decoItem.style.width = w; decoItem.style.height = h;
                } else {
                    const randomImg = imageAssets[Math.floor(Math.random() * imageAssets.length)];
                    decoItem = document.createElement('img');
                    decoItem.src = randomImg.src; 
                    decoItem.alt = randomImg.alt;
                    decoItem.className = 'deco-img';
                    
                    decoItem.onerror = function() {
                        const fallback = document.createElement('div');
                        fallback.className = 'deco-img'; 
                        fallback.style.fontSize = '36px'; 
                        fallback.textContent = this.alt;
                        this.parentNode.replaceChild(fallback, this);
                    };
                    const scale = Math.random() * 0.5 + 1.0; 
                    decoItem.style.width = (72 * scale) + 'px'; 
                }

                decoItem.style.left = Math.random() * 100 + '%';
                
                let duration;
                if (decoItem.tagName === 'IMG') {
                     duration = Math.random() * 6 + 12; 
                } else {
                     duration = Math.random() * 8 + 10; 
                }
                decoItem.style.animationDuration = duration + 's';

                const delay = Math.random() * duration * -1;
                decoItem.style.animationDelay = delay + 's';
                
                container.appendChild(decoItem);
            }
        }
        window.addEventListener('load', initBackgroundDecorations);

        // --- 2. 飲料店名單 ---
        const shops = [
            { name: "八曜和茶", menuUrl: "./8yo.png", mapQuery: "八曜和茶 台中大甲門市", phone: "0426888988" }, 
            { name: "茶聚 CHAGE", menuUrl: "./chage.jpg", mapQuery: "茶聚大甲鎮瀾店", phone: "0426883652" }, 
            { name: "CoCo都可", menuUrl: "./coco.jpg", mapQuery: "CoCo都可 大甲店", phone: "0426888806" }, 
            { name: "茶湯會", menuUrl: "./tptea.jpg", mapQuery: "茶湯會 大甲鎮瀾店", phone: "0426889118" }, 
            { name: "麻古茶坊", menuUrl: "./macu.jpg", mapQuery: "麻古茶坊大甲鎮瀾店", phone: "0426889996" }, 
            { name: "可不可熟成紅茶", menuUrl: "./kebuke.jpg", mapQuery: "可不可熟成紅茶大甲店", phone: "0426887553" }, 
            { name: "50嵐", menuUrl: "./50lan.jpg", mapQuery: "50嵐大甲店", phone: "0426880150" }, 
            { name: "龜記茗品", menuUrl: "./guiji.jpg", mapQuery: "龜記茗品-大甲順天店", phone: "0426805727" }, 
            { name: "得正 Oolong Tea", menuUrl: "./dejeng.jpg", mapQuery: "得正#台中大甲計劃", phone: "0426803722" }, 
            { name: "一沐日", menuUrl: "./yimuri.jpg", mapQuery: "一沐日 台中大甲店", phone: "0426865588" }, 
            { name: "迷客夏 Milksha", menuUrl: "./milksha.jpg", mapQuery: "迷客夏大甲店", phone: "0426805319" }, 
            { name: "清心福全", menuUrl: "./chingshin.jpg", mapQuery: "清心福全大甲店", phone: "0426882861" } 
        ];

        let isRitualRunning = false;
        let currentWinner = null;
        let orderList = [];

        function startRitual() {
            if (isRitualRunning) return;
            isRitualRunning = true;

            const btn = document.getElementById('draw-btn');
            const textArea = document.getElementById('text-area');
            const moonArea = document.getElementById('moon-blocks-area');
            const stickArea = document.getElementById('stick-area');
            const statusText = document.getElementById('status-text');
            const menuArea = document.getElementById('menu-area');
            const shopDesc = document.getElementById('shop-desc');

            btn.disabled = true;
            menuArea.style.display = "none";
            shopDesc.style.display = "none";
            textArea.style.display = "none"; 
            
            orderList = [];
            renderOrderList();

            moonArea.style.display = "flex";
            moonArea.classList.remove('saint-cup'); // 重置為擲筊前狀態
            moonArea.classList.add('tossing');
            statusText.style.display = "block";
            statusText.innerText = "🙏 誠心擲筊中...";
            
            setTimeout(() => {
                moonArea.classList.remove('tossing');
                moonArea.classList.add('saint-cup'); 
                statusText.innerText = "✨ 聖筊！(神明同意)";
                
                setTimeout(() => {
                    moonArea.style.display = "none"; 
                    stickArea.style.display = "flex"; 
                    stickArea.classList.add('drawing-stick');
                    statusText.innerText = "📜 抽籤中...";

                    setTimeout(() => {
                        stickArea.style.display = "none";
                        stickArea.classList.remove('drawing-stick');
                        statusText.style.display = "none";
                        finalizeDraw(); 
                    }, 1500);

                }, 1000);

            }, 1500);
        }

        function finalizeDraw() {
            const finalIndex = Math.floor(Math.random() * shops.length);
            currentWinner = shops[finalIndex]; 

            const textArea = document.getElementById('text-area');
            const nameDisplay = document.getElementById('shop-name');
            const descDisplay = document.getElementById('shop-desc');
            const menuImg = document.getElementById('menu-img');
            const modalImg = document.getElementById('img-in-modal');
            const mapLink = document.getElementById('map-link');
            const phoneLink = document.getElementById('phone-link');
            const btn = document.getElementById('draw-btn');
            const menuArea = document.getElementById('menu-area');

            textArea.style.display = "flex";
            
            nameDisplay.textContent = currentWinner.name;
            nameDisplay.style.color = "#e73c7e"; 
            nameDisplay.style.textShadow = "1px 1px 0px rgba(0,0,0,0.1)";
            descDisplay.style.display = "block";
            
            menuImg.src = currentWinner.menuUrl;
            modalImg.src = currentWinner.menuUrl; 

            menuImg.onerror = function() {
                this.src = ''; this.alt = "⚠️ 找不到圖片，請檢查 GitHub 檔名";
                this.style.minHeight = "100px";
            };
            mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(currentWinner.mapQuery)}`;
            phoneLink.href = `tel:${currentWinner.phone}`;
            
            menuArea.style.display = "block";
            btn.disabled = false;
            btn.textContent = "再求一支籤 🧧";
            isRitualRunning = false;
        }

        // --- 點餐小本本邏輯 ---
        function addOrder() {
            const name = document.getElementById('input-name').value.trim();
            const item = document.getElementById('input-item').value.trim();
            const config = document.getElementById('input-config').value.trim();

            if (!item) { alert("至少要填寫品項喔！"); return; }

            orderList.push({ name, item, config });
            renderOrderList();

            document.getElementById('input-name').value = '';
            document.getElementById('input-item').value = '';
            document.getElementById('input-config').value = '';
        }

        function removeOrder(index) {
            orderList.splice(index, 1);
            renderOrderList();
        }

        function renderOrderList() {
            const listEl = document.getElementById('order-list');
            listEl.innerHTML = "";
            orderList.forEach((order, index) => {
                const li = document.createElement('li');
                li.className = 'order-item';
                li.innerHTML = `
                    <span>${order.name ? order.name + ': ' : ''}${order.item} <small>(${order.config})</small></span>
                    <span class="delete-btn" onclick="removeOrder(${index})">×</span>
                `;
                listEl.appendChild(li);
            });
        }

        function copyAllOrders() {
            if (!currentWinner) return;
            
            let text = `【訂購單】${currentWinner.name}\n`;
            text += `電話：${currentWinner.phone}\n`;
            text += `----------------\n`;
            
            if (orderList.length === 0) {
                text += `(尚未新增訂單)\n`;
            } else {
                orderList.forEach((order, i) => {
                    text += `${i+1}. ${order.name ? order.name : '一位'}：${order.item} ${order.config ? '('+order.config+')' : ''}\n`;
                });
                text += `----------------\n`;
                text += `總共 ${orderList.length} 杯`;
            }

            navigator.clipboard.writeText(text).then(() => {
                alert("✅ 訂購單已複製！\n可以直接貼給老闆或備忘錄囉！");
            }).catch(err => alert("複製失敗"));
        }

        // --- 縮放與燈箱 ---
        let scale = 1; let p1 = { x: 0, y: 0 }; let initialDistance = 0;
        let isDragging = false; let startX, startY, translateX = 0, translateY = 0, lastTranslateX = 0, lastTranslateY = 0;

        function openModal() {
            const modal = document.getElementById("image-modal");
            const menuImg = document.getElementById('menu-img');
            const modalImg = document.getElementById('img-in-modal');
            if (menuImg.src && menuImg.src !== window.location.href) {
                 modal.style.display = "flex";
                 scale = 1; translateX = 0; translateY = 0; lastTranslateX = 0; lastTranslateY = 0;
                 modalImg.style.transform = `scale(1) translate(0px, 0px)`;
            }
        }
        function closeModal() {
            document.getElementById("image-modal").style.display = "none";
        }

        const modalImg = document.getElementById('img-in-modal');
        const modal = document.getElementById('image-modal');

        modal.addEventListener('touchstart', function(e) {
            if (e.touches.length === 2) {
                initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            } else if (e.touches.length === 1) {
                isDragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY;
            }
        });

        modal.addEventListener('touchmove', function(e) {
            e.preventDefault(); 
            if (e.touches.length === 2) {
                const currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                if (initialDistance > 0) {
                    const delta = currentDistance / initialDistance;
                    let tempScale = scale * delta;
                    tempScale = Math.min(Math.max(1, tempScale), 4);
                    modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${tempScale})`;
                }
            } else if (e.touches.length === 1 && isDragging && scale > 1) {
                const currentX = e.touches[0].clientX; const currentY = e.touches[0].clientY;
                const diffX = currentX - startX; const diffY = currentY - startY;
                translateX = lastTranslateX + diffX; translateY = lastTranslateY + diffY;
                modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            }
        });

        modal.addEventListener('touchend', function(e) {
            if (e.touches.length < 2) {
                if(modalImg.style.transform.includes('scale')) {
                    const match = modalImg.style.transform.match(/scale\(([^)]+)\)/);
                    if(match) scale = parseFloat(match[1]);
                }
            }
            if (e.touches.length === 0) {
                isDragging = false; lastTranslateX = translateX; lastTranslateY = translateY;
            }
        });

        function getFullMenuUrl() {
            if (!currentWinner) return "";
            return new URL(currentWinner.menuUrl, window.location.href).href;
        }

        function shareToLine() {
            if (!currentWinner) return;
            const fullMenuUrl = getFullMenuUrl();
            const text = `🥳 大甲手搖抽籤結果：\n我們今天喝「${currentWinner.name}」！\n\n📜 菜單連結：\n${fullMenuUrl}\n\n👇 複製下方格式點餐：\n姓名：\n品項：\n糖度冰塊：\n\n📍 地圖導航：\nhttps://www.google.com/maps/search/?api=1&query=${encodeURIComponent(currentWinner.mapQuery)}`;
            window.open(`https://line.me/R/msg/text/?${encodeURIComponent(text)}`, '_blank');
        }
    </script>
</body>
